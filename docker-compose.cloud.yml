
# ==============================================================================
# Cloud Deployment Mode Configuration (AWS EC2 / Multi-Node Production)
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.cloud.yml up -d --build
#
# This configuration connects to managed cloud services (e.g., AWS ElastiCache for
# Redis, MongoDB Atlas, AWS S3 for object storage), and exposes the API and UI
# through production-grade proxying with isolated worker services.
# ==============================================================================

services:
  # =============================================================
  # Production API Server
  # =============================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cdc-cloud-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEPLOYMENT_MODE=cloud
      - DEBUG=false
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-cdc_image_processor}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-${REDIS_URL}}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      - STORAGE_BACKEND=s3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - API_KEY=${API_KEY}
    networks:
      - cdc-cloud-net

  # =============================================================
  # Distributed Worker Node 1
  # =============================================================
  worker-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cdc-cloud-worker-1
    command: celery -A app.tasks.celery_app worker -Q default -c 4 -n worker-cloud-1@%h --loglevel=info
    restart: always
    environment:
      - DEPLOYMENT_MODE=cloud
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-cdc_image_processor}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-${REDIS_URL}}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      - STORAGE_BACKEND=s3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    networks:
      - cdc-cloud-net

  # =============================================================
  # Distributed Worker Node 2
  # =============================================================
  worker-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cdc-cloud-worker-2
    command: celery -A app.tasks.celery_app worker -Q default -c 4 -n worker-cloud-2@%h --loglevel=info
    restart: always
    environment:
      - DEPLOYMENT_MODE=cloud
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-cdc_image_processor}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-${REDIS_URL}}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      - STORAGE_BACKEND=s3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    networks:
      - cdc-cloud-net

  # =============================================================
  # Production Frontend SPA
  # =============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cdc-cloud-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - cdc-cloud-net

networks:
  cdc-cloud-net:
    driver: bridge
